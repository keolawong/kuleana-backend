server:
  port: ${PORT:8081}

spring:
  application:
    name: assets

  # 1. Spring Data JPA Core (Uses low-privilege runtime user)
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME:neondb}?sslmode=require&currentSchema=asset
    username: ${DB_APP_USER:asset_app}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 2. Flyway Schema Migrator (Overrides connection to use high-privilege owner)
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME:neondb}?sslmode=require
    user: ${DB_MIGRATION_USER:neondb_owner}
    password: ${DB_MIGRATION_PASSWORD}
    schemas: asset
    create-schemas: true
    validate-on-migrate: false
    placeholders:
      db_app_user: ${DB_APP_USER:asset_app}

  # 3. Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: asset
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      export:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,https://test.assets.kahua.com,https://*.web.app,https://*.firebaseapp.com}
  rate-limit:
    bulk-per-minute: ${RATE_LIMIT_BULK_PER_MIN:10}

kahua:
  tracker:
    base-url: ${TRACKER_BASE_URL:http://localhost:8080/api}