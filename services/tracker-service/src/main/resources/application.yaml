server:
  forward-headers-strategy: framework

spring:
  application:
    name: tracker

  # 1. Spring Data JPA Core (Uses low-privilege runtime user)
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME:neondb}?sslmode=require&currentSchema=tracker
    username: ${DB_APP_USER:tracker_app}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 2. Flyway Schema Migrator (Overrides connection to use high-privilege owner)
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME:neondb}?sslmode=require
    user: ${DB_MIGRATION_USER:neondb_owner}
    password: ${DB_MIGRATION_PASSWORD}
    schemas: tracker
    create-schemas: true
    validate-on-migrate: false
    placeholders:
      db_app_user: ${DB_APP_USER:tracker_app}

  # 3. Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: tracker
        dialect: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      com.zaxxer.hikari: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      export:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

cloud:
  run:
    url: ${CLOUD_RUN_URL:}

gcp:
  project-id: ${GCP_PROJECT_ID:project-3eaeea86-ca1c-4d5b-ae6}
  location: ${GCP_LOCATION:us-central1}
  queue-name: ${GCP_QUEUE_NAME:tracker-flow-lz-queue}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,https://test.assets.kahua.com,https://*.web.app,https://*.firebaseapp.com}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:9999}
  internal-task-api-key: ${INTERNAL_TASK_API_KEY:default-internal-key-change-me}
