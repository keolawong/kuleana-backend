services:
  # Optional local PostgreSQL (only started if explicitly requested via --profile local-db)
  postgres:
    image: postgres:16-alpine
    container_name: kuleana-postgres
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-kuleanadb}
      POSTGRES_USER: ${LOCAL_DB_USER:-kuleana_user}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-kuleana_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - kuleana-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-kuleana_user} -d ${LOCAL_DB_NAME:-kuleanadb}"]
      interval: 4s
      timeout: 3s
      retries: 5

  # Tracker Service (Spring Boot 4 / Java 25 - Targets Neon Dev Branch tracker schema)
  tracker-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: tracker-service
    container_name: kuleana-tracker-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SERVER_PORT: 8081
      DB_HOST: ${DB_HOST:-ep-jolly-sky-akn41zbq-pooler.c-3.us-west-2.aws.neon.tech}
      DB_NAME: ${DB_NAME:-neondb}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-neondb_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-npg_fc0e7qbFoQkW}
      DB_APP_USER: ${DB_APP_USER:-kahua_tracker_rwd}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-01S-0L1ph4nt5-crIt1c123-6lOtt1d34n-C4rr0t135t-pAn5p3rmy}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-ep-jolly-sky-akn41zbq-pooler.c-3.us-west-2.aws.neon.tech}/${DB_NAME:-neondb}?sslmode=${DB_SSLMODE:-require}&currentSchema=tracker
      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST:-ep-jolly-sky-akn41zbq-pooler.c-3.us-west-2.aws.neon.tech}/${DB_NAME:-neondb}?sslmode=${DB_SSLMODE:-require}&currentSchema=tracker
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USER:-neondb_owner}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:-npg_fc0e7qbFoQkW}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: "tracker"
      SPRING_FLYWAY_DEFAULT_SCHEMA: "tracker"
      APP_JWTSECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://localhost:8082
    networks:
      - kuleana-net

  # Assets Service (Spring Boot 4 / Java 25 - Targets Neon Dev Branch asset schema)
  assets-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: assets-service
    container_name: kuleana-assets-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      SERVER_PORT: 8082
      DB_HOST: ${DB_HOST:-ep-jolly-sky-akn41zbq-pooler.c-3.us-west-2.aws.neon.tech}
      DB_NAME: ${DB_NAME:-neondb}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-neondb_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-npg_fc0e7qbFoQkW}
      DB_APP_USER: ${DB_ASSET_APP_USER:-kahua_asset_rwd}
      DB_APP_PASSWORD: ${DB_ASSET_APP_PASSWORD:-cl0Dp0ll-f4nAt1c-pEr1k4ry0n-F05t3r3r-p1p1-v1tR41n}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-ep-jolly-sky-akn41zbq-pooler.c-3.us-west-2.aws.neon.tech}/${DB_NAME:-neondb}?sslmode=${DB_SSLMODE:-require}&currentSchema=asset
      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST:-ep-jolly-sky-akn41zbq-pooler.c-3.us-west-2.aws.neon.tech}/${DB_NAME:-neondb}?sslmode=${DB_SSLMODE:-require}&currentSchema=asset
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USER:-neondb_owner}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:-npg_fc0e7qbFoQkW}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_SCHEMAS: "asset"
      SPRING_FLYWAY_DEFAULT_SCHEMA: "asset"
      APP_JWTSECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://localhost:8082
    networks:
      - kuleana-net

  # Kuleana Assets Frontend (Vite / React / Nginx)
  kule-assets:
    build:
      context: ../kuleana-frontend
      dockerfile: docker/Dockerfile.assets
    container_name: kuleana-assets-ui
    ports:
      - "3001:80"
    depends_on:
      - tracker-service
      - assets-service
    networks:
      - kuleana-net

networks:
  kuleana-net:
    driver: bridge

volumes:
  pgdata:
